name: Flutter Build Check

on:
  pull_request:
    branches:
      - br-QuickQuiz
      - br-ProjectIQ

jobs:
  build-check:
    name: Flutter Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web (verify)
        run: flutter build web --release
